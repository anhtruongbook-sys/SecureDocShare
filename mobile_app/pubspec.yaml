name: securedoc_mobile
description: Krypto Mobile Client - Post-Quantum Cryptography (ML-KEM-768) & Offline Document Vault (Android APK)
publish_to: 'none'
version: 3.2.4+91

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  file_picker: ^8.0.3
  share_plus: ^10.0.0
  path_provider: ^2.1.2
  syncfusion_flutter_pdf: ^26.2.14
  crypto: ^3.0.6
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/www/
    - assets/www/static/
