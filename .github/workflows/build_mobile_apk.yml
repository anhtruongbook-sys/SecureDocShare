name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.0
          name: "KryptoDoc v2.3.0 - AutoCAD DWG & Universal Password-Protected ZIP Vault (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.3.0 (AutoCAD .DWG & Universal Password-Protected ZIP Vault)
            - **Khóa Mật Khẩu Tệp Nén .ZIP Chuẩn Quốc Tế (Zip4j Engine AES-256)**:
              + Tự động nén và mã hóa mật khẩu cực mạnh AES-256 cho tệp nén `.zip`.
              + Mở và giải nén tương thích 100% với mọi phần mềm giải nén hàng đầu thế giới: **WinRAR, 7-Zip, ZArchiver, Xiaomi / Samsung File Manager** hoặc chính KryptoDoc.
            - **Bảo Vệ Chuyên Nghiệp Bản Vẽ Kỹ Thuật AutoCAD (.DWG / .DXF)**:
              + Khắc phục hoàn toàn hạn chế của Autodesk AutoCAD (đã lược bỏ tính năng đặt pass nội bộ từ AutoCAD 2016-2026).
              + Tự động nhận diện bản vẽ `.dwg`, đóng gói vào tệp nén `.zip` bảo vệ mật khẩu cấp quân sự AES-256, an tâm gửi qua Zalo / Telegram / Email.
            - **Chế Độ Xuất Tệp Linh Hoạt (Dual Packaging Modes)**:
              + 🔒 *Định Dạng Gốc*: Giữ nguyên đuôi tệp Word, Excel, PowerPoint, PDF mở trực tiếp trên MS Office & Adobe Reader.
              + 📦 *Nén .ZIP Có Pass*: Đóng gói một hoặc nhiều tệp vào kho bảo mật `.zip` có mật khẩu, tự động kích hoạt khi chọn bản vẽ CAD hoặc nhiều tệp cùng lúc.
            - **Mẫu Bảo Mật Bổ Sung**: 📐 *Bản Vẽ CAD .DWG* (1-Chạm kích hoạt chế độ nén ZIP mật khẩu quân sự).
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` (hoặc `SecureDocShare.apk`) bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
