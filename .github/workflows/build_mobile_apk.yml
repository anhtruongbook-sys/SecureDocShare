name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.3
          name: "KryptoDoc v2.3.3 - Smart Pre-Flight Detection & Double-Lock Prevention (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.3.3 (Nhận Diện Thông Minh & Chống Khóa Chồng Gây Lỗi)
            - **Nhận Diện Tệp Đã Khóa Ngay Khi Chọn (Smart Pre-Flight Detection)**:
              + Kiểm tra nhị phân (Deep Binary Inspection): Quét cấu trúc nhị phân của tệp để phát hiện `/Encrypt` (PDF Adobe ISO 32000), `EncryptedPackage` (Microsoft Office OLE), cờ mã hóa ZipCrypto/AES (ZIP) và Header KryptoDoc Vault.
              + Kiểm tra hậu tố tên tệp: Tự động nhận diện các tệp `_Locked`, `_ReadOnly`, `_Protected`, `_Encrypted`.
            - **Giao Diện Cảnh Báo Trực Quan & Điều Hướng 1-Chạm (1-Tap Auto-Redirect)**:
              + Hiển thị huy hiệu màu cam nổi bật: `🔒 ĐÃ CÓ MẬT KHẨU`.
              + Xuất hiện Banner cảnh báo thông minh kèm nút bấm: `[🔓 Chuyển sang Tab MỞ KHÓA ngay]`.
              + Khi chạm vào, hệ thống tự động chuyển Tab và nạp sẵn tệp vào ô Mở Khóa, người dùng chỉ việc nhập mật khẩu để mở hoặc đổi pass.
            - **Khóa Chặn Lỗi Ở Cả Frontend & Động Cơ Native (Double-Lock Prevention Guard)**:
              + Khi người dùng bấm nút Khóa: App lập tức bật hộp thoại cảnh báo chống khóa đè.
              + Động cơ Native (iTextG / POI / Zip4j / Syncfusion): Tự động phát hiện trạng thái đã mã hóa và trả về thông báo tiếng Việt chuẩn xác thay vì ném lỗi crash.
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
