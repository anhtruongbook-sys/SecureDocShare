name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.8.1
          name: "Krypto v2.8.1 - Tự Động Nhận Dạng & Nhóm Tri Thức Theo Chủ Đề + Xuất Tệp .MD Qua MediaStore Downloads"
          body: |
            ## Ứng dụng Di Động Krypto v2.8.1 (PQC ML-KEM-768 + Chat Knowledge Vault v3.1)
            - **Tự Động Nhận Dạng Chủ Đề & Nhóm Theo Chủ Đề (`Auto-Topic Clustering`)**:
              + Tự động phân tích nội dung, tiêu đề và từ khóa để nhận diện **10 nhóm chủ đề chuyên sâu** (`📈 Chiến lược RevOps, Kinh doanh & Quản trị`, `🤖 AI Agent & Công cụ Lập trình`, `🛡️ An toàn Thông tin & Kiểm toán Bảo mật`, `⚖️ Pháp lý, Đấu thầu & Quy chuẩn Xây dựng`, `🏗️ BIM, CDE & Kỹ thuật Công trình`, `💰 Tài chính, Đầu tư & Kinh tế Vĩ mô`, `🧬 Y sinh, Ngân hàng Sinh học & Nghiên cứu KH&CN`, `🌐 Hạ tầng Đám mây, Mạng & Hệ thống`, `☯️ Huyền học, Tử vi & Phong thủy`) hoặc tự sinh nhãn chủ đề động (`🔖 Chủ đề: ...`) cho lĩnh vực mới.
              + **Thanh Chip Chủ Đề 1 Chạm (`#cvTopicChipsBar`)** thống kê số lượng bản ghi theo từng chủ đề.
              + **Chế độ `🗂️ Nhóm theo Chủ đề` (Mặc định bật)**: Tự động gom các bản ghi cùng chủ đề vào từng phân đoạn có nút **Thu gọn / Mở rộng** và nút **`📝 Xuất Nhóm (.md)`** để xuất toàn bộ tài liệu thuộc 1 chủ đề ra 1 tệp Markdown tổng hợp duy nhất.
            - **Lưu Tệp `.md` / `.json` Qua Chuẩn Android `MediaStore.Downloads` & Mở/Chia Sẻ Ngay 1 Chạm (`v2.8.0`)**.
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
