name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.2
          name: "KryptoDoc v2.3.2 - Auto-Packaging Encrypted ZIP Vault for Images & CAD (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.3.2 (Tự Động Nén .ZIP Mã Hóa AES-256 Cho Ảnh & CAD)
            - **Khắc Phục Triệt Để Lỗi "Tệp Lỗi Định Dạng" (Corrupted File Fix)**:
              + Định dạng ảnh (`.png`, `.jpg`, `.jpeg`, `.gif`, `.webp`) và CAD (`.dwg`, `.dxf`) không có tiêu chuẩn mật khẩu nội tại như PDF/Office.
              + Trước đây hệ thống ghi luồng cipher trực tiếp giữ đuôi ảnh gây lỗi không xem được trong Thư viện ảnh Android.
              + Phiên bản v2.3.2 tự động đóng gói nguyên vẹn tệp ảnh vào kho nén tiêu chuẩn `${baseName}_Protected.zip` bằng động cơ Zip4j AES-256.
            - **Cơ Chế Tự Động Nhận Diện & Khóa Chế Độ Thông Minh (Smart Format Auto-Switch)**:
              + Ngay khi người dùng chọn tệp ảnh hoặc bản vẽ kỹ thuật, ứng dụng tự động kích hoạt thẻ `📦 Nén .ZIP Có Pass` kèm thông báo hướng dẫn.
              + Khóa ngăn người dùng chọn nhầm chế độ `Định Dạng Gốc` đối với các tệp không hỗ trợ mật khẩu gốc, bảo vệ an toàn 100% cấu trúc dữ liệu.
            - **Khả Năng Giải Nén Tương Thích Toàn Cầu**:
              + Tệp `.zip` xuất ra đạt chuẩn bảo mật AES-256 quốc tế, mở và giải nén lập tức bằng mật khẩu trên: WinRAR, 7-Zip, ZArchiver, Quản lý tệp Samsung/Xiaomi, hoặc Tab MỞ KHÓA của KryptoDoc.
            - **Cập Nhật Thẻ Định Dạng & Nhãn Trực Quan**:
              + Bổ sung huy hiệu màu Cyan hiện đại `IMG` cho các định dạng ảnh cùng nhãn giao thức `Zip4j AES-256 Vault`.
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
