name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.7.8
          name: "Krypto v2.7.8 - Kho Tri Thức Song Ngữ (Mặc Định Tiếng Việt) & Tự Động Xử Lý Link Chia Sẻ"
          body: |
            ## Ứng dụng Di Động Krypto v2.7.8 (PQC ML-KEM-768 + Chat Knowledge Vault v1.2)
            - **Hỗ Trợ Song Ngữ (`🇻🇳 Tiếng Việt` Mặc Định | Chuyển Đổi `🇬🇧 English`)**:
              + Tự động dịch và chuẩn hóa toàn bộ Tiêu đề, Tóm tắt 1 dòng, Tổng quan điều hành, Mục lục chương, Ý tưởng cốt lõi, Đúc kết sâu và Khuyến nghị hành động sang **Tiếng Việt mặc định** (`i18n.vi`).
              + Hỗ trợ nút chuyển đổi ngôn ngữ 1 chạm (`🇻🇳 Tiếng Việt` | `🇬🇧 English`) ngay trên thanh công cụ và trong màn hình chi tiết bản ghi.
              + Tự động nâng cấp các bản ghi tiếng Anh hiện có trong bộ nhớ thiết bị sang định dạng song ngữ Việt - Anh.
            - **Tự Động Bóc Tách Ngay Khi Chia Sẻ Link Sang Krypto (`Share -> Krypto`)**:
              + Bắt sự kiện `Intent.ACTION_SEND` đồng bộ ngay từ tầng Native Kotlin -> Dart MethodChannel -> JavaScript Queue, tự động chuyển sang Tab `🧠 Tri thức`, điền link, chạy bóc tách + dịch thuật Tiếng Việt và mở ngay trang Chi tiết bản ghi.
            - **Kế thừa toàn diện v2.7.7**: Mật mã Hậu lượng tử `ML-KEM-768` (FIPS 203) + `AES-256-GCM` + `PQC Master Key Escrow`, Sao lưu 3 lớp (`Triple-Persistence`), Bảng Responsive chuẩn thẻ đơn (Rule 14).
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
