name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.1.0
          name: "KryptoDoc v2.1.0 - Military Password Entropy & Rich Vault (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.1.0 (Giai Đoạn 2: Trải Nghiệm & Đột Phá Tính Năng)
            - **Thước Đo Độ Mạnh Mật Khẩu (Password Entropy Meter)**: Phân tích thời gian thực độ an toàn mật khẩu theo 4 cấp độ trực quan: Yếu, Trung Bình, Mạnh, và Chuẩn Cấp Quân Sự 256-bit 🛡️.
            - **Bộ Sinh Mật Khẩu Quân Sự 1-Chạm (Military Password Generator)**: Tự động sinh mật khẩu ngẫu nhiên 16 ký tự mã hóa cao cấp (bao gồm chữ hoa, chữ thường, số, ký tự đặc biệt) kết hợp sao chép tự động vào bộ nhớ tạm.
            - **Thẻ Xem Trước Tệp Chi Tiết & Nhận Diện Giao Thức (Rich File Preview Cards)**:
              + Phân loại biểu tượng chuyên nghiệp theo từng định dạng: Word (`DOC`), Excel (`XLS`), PowerPoint (`PPT`), PDF (`PDF`).
              + Hiển thị dung lượng định dạng chuẩn (`KB`, `MB`).
              + Tự động gán nhãn giao thức bảo mật tương ứng: `[MS-OFFCRYPTO 256-bit]` cho Office và `[Adobe ISO 32000]` cho PDF.
            - **Nhật Ký Phiên Làm Việc Cục Bộ (Zero-Knowledge Session History)**: Quản lý lịch sử các tệp đã mã hóa / mở khóa trong phiên ngay tại thiết bị, bảo mật 100% offline, có nút xóa nhanh một chạm.
            - **Nút Sao Chép Mật Khẩu Tại Kết Quả**: Giúp người dùng sao chép nhanh mật khẩu đã đặt để gửi kèm qua Zalo / email cùng file mã hóa.
            - **Biểu tượng Cyber Shield Động Tương Tác**: Xoay radar orbital ring, phát quang neon, nảy haptic 3D.
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` (hoặc `SecureDocShare.apk`) bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
