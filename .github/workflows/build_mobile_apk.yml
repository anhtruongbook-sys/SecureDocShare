name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureDocShare-mobile-release-apk
          path: build-output/SecureDocShare.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.4
          name: "SecureDocShare v1.0.4 (Android APK)"
          body: |
            ## Ứng dụng Di Động SecureDocShare Cài Đặt Trực Tiếp (Android APK v1.0.4)
            - **Khắc phục triệt để lỗi File lớn (OOM Fix)**: Tối ưu hóa bộ nhớ RAM, kích hoạt `android:largeHeap="true"`, giải thuật Base64 Chunking 32KB chống sập ứng dụng khi chọn tệp dung lượng lớn.
            - **Lưu trực tiếp vào Thư mục Tải về (Downloads)**: Nút "Lưu Tệp" ghi trực tiếp file mã hóa vào thư mục Downloads của điện thoại và hiển thị thông báo SnackBar xác nhận.
            - **Chia sẻ Native 1-Chạm**: Nút "Chia Sẻ" mở trực tiếp bảng chia sẻ Android để gửi ngay qua Zalo, Drive, Gmail, Telegram.
            - **Mở khóa & Trích xuất File**: Hỗ trợ mở khóa và lưu file gốc trực tiếp trên điện thoại.
            - **Icon & Logo Mới**: Nhận diện thương hiệu chính thức ANH'S TEAM.
            - **Tải tệp APK**: Tải file `SecureDocShare.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: build-output/SecureDocShare.apk
          draft: false
          prerelease: false
