name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureDocShare-mobile-release-apk
          path: build-output/SecureDocShare.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.7
          name: "SecureDocShare v1.0.7 (Android APK)"
          body: |
            ## Ứng dụng Di Động SecureDocShare Cài Đặt Trực Tiếp (Android APK v1.0.7)
            - **Mã Hóa & Khóa File PDF Native 100% Chuẩn Quốc Tế Adobe ISO 32000**: Chọn file PDF sẽ xuất ra đúng file `.pdf` (`_Locked.pdf` hoặc `_ReadOnly.pdf`).
            - **Tương thích Adobe Acrobat, Photoshop, Foxit Reader, WPS Office**: Mở file trên điện thoại hoặc máy tính sẽ hiện ngay hộp thoại native của Adobe yêu cầu nhập mật khẩu.
            - **Hỗ trợ 2 Chế Độ Phân Quyền**:
              1. Khóa Chặt: Nhập đúng mật khẩu mới mở được PDF.
              2. Mở Xem Tự Do: Mở xem trực tiếp không cần pass, nhưng CẤM IN, CẤM COPY chữ theo chuẩn Adobe R6.
            - **Khóa Chữ Ký Số Cố Định (Fixed Release Keystore)**: Giữ nguyên chữ ký số chuẩn phát hành, hỗ trợ cập nhật đè mượt mà.
            - **Tải & Lưu Tệp Native (SAF)**: Hộp thoại chọn thư mục lưu (Downloads) + Nút gửi trực tiếp qua Zalo.
            - **Tải tệp APK**: Tải file `SecureDocShare.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: build-output/SecureDocShare.apk
          draft: false
          prerelease: false
