name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.8.2
          name: "Krypto v2.8.2 - Phát Hiện Trùng Lặp Nội Dung 3 Tầng (Canonical URL + Cosine/Bigram Similarity >= 72%)"
          body: |
            ## Ứng dụng Di Động Krypto v2.8.2 (PQC ML-KEM-768 + Chat Knowledge Vault v3.2)
            - **Bộ Phát Hiện Trùng Lặp 3 Tầng (`3-Layer Duplicate & Similarity Detector`)**:
              + **Tầng 1 — Chuẩn hóa URL & Khớp tức thì (`normalizeCanonicalUrl`)**: Tự động loại bỏ mọi tham số theo dõi (`utm_*`, `fbclid`, `gclid`, `si=...`, `feature=...`). Nếu phát hiện Video/GitHub/Web đã có sẵn trong kho -> **Không tốn thời gian tải lại**, mở thẳng bản ghi hiện có ngay lập tức (0.1s), tự động gộp thêm ghi chú mới và cho phép chọn **`🔄 Bóc Tách & Làm Mới Lại`** nếu muốn cập nhật.
              + **Tầng 2 — So khớp độ tương đồng ngữ nghĩa (`computeContentSimilarity` >= 72%)**: Kết hợp Vector TF Cosine (72%) và Bigram Shingle Jaccard (28%) khử dấu tiếng Việt để phát hiện các ghi chú/bài viết trùng hoặc gần trùng nội dung, hiển thị tỷ lệ trùng khớp (`%`) kèm tùy chọn **`➕ Vẫn Lưu Thành Bản Riêng`** hoặc **`Giữ Bản Đã Có`**.
              + **Tầng 3 — Công cụ `🧹 Quét trùng` toàn kho (`scanAndMergeVaultDuplicates`)**: Rà soát toàn bộ kho 1 chạm để phát hiện và gộp tự động các bản ghi trùng lặp.
            - **Kế thừa toàn diện v2.8.1**: Tự động nhận dạng & nhóm theo 10 chủ đề, xuất tệp `.md` chuẩn `MediaStore.Downloads` kèm hộp thoại Mở/Chia sẻ ngay.
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
