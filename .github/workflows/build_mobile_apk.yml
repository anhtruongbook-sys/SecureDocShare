name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureDocShare-mobile-release-apk
          path: build-output/SecureDocShare.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.3
          name: "SecureDocShare v1.0.3 (Android APK)"
          body: |
            ## Ứng dụng Di Động SecureDocShare Cài Đặt Trực Tiếp (Android APK v1.0.3)
            - **Icon & Logo Mới**: Tích hợp nhận diện thương hiệu logo chính thức của ANH'S TEAM.
            - **Native File Picker Cục Bộ**: Tích hợp bộ chọn tệp native trên Android (hỗ trợ chọn trực tiếp file PDF, Word, Excel, PPT từ bộ nhớ máy, Thẻ nhớ SD, Tải xuống, v.v.).
            - **Mã Hóa & Khóa File Cấp Quân Sự (AES-256)**: Chạy 100% Offline độc lập trên điện thoại.
            - **Hỗ trợ 2 Chế Độ Phân Quyền**:
              1. Khóa Chặt: Chỉ nhập đúng pass mới mở được file.
              2. Mở Xem Tự Do, nhưng CẤM SỬA, CẤM IN, CẤM COPY văn bản và hình ảnh.
            - **Tải tệp APK**: Tải file `SecureDocShare.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: build-output/SecureDocShare.apk
          draft: false
          prerelease: false
