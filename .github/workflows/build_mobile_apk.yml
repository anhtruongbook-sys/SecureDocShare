name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.8
          name: "KryptoDoc v2.3.8 - Dual Notification Engine & Active Cyber Modal (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.3.8 (Khắc Phục Hiển Thị & Cơ Chế Thông Báo Kép)
            - **Cơ Chế Thông Báo Kép (Dual Notification Engine)**:
              + Kích hoạt đồng thời cả Krypto Toast cảnh báo nhanh và Cyber Modal Dialog sang trọng.
              + Khắc phục hoàn toàn lỗi xung đột class CSS hiển thị giữa .active và .show trên Android WebView.
              + Đảm bảo 100% người dùng nhận thông báo cảnh báo rõ ràng khi chưa chọn tệp hoặc chưa nhập mật khẩu.
            - **Hiệu Ứng Trực Quan Cao Cấp**:
              + Tự động focus con trỏ vào ô mật khẩu kèm hiệu ứng rung lắc viền nổi bật (Pulse Shake Animation).
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
