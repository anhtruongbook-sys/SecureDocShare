name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.4
          name: "KryptoDoc v2.3.4 - Auto-Redirect & Clean Locked State UI (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.3.4 (Tự Động Chuyển Tab Mở Khóa & Tối Ưu Hóa Giao Diện Tinh Gọn)
            - **Tự Động Chuyển Thẳng Sang Tab MỞ KHÓA (Zero-Tap Auto-Redirect)**:
              + Ngay khi người dùng chọn 1 tệp đã có mật khẩu bảo vệ ở Tab Khóa: Ứng dụng lập tức chuyển sang Tab MỞ KHÓA, nạp sẵn tệp và tự động đặt con trỏ vào ô nhập mật khẩu.
              + Không làm mất thời gian người dùng, không cần phải bấm nút chuyển hướng thủ công.
            - **Khắc Phục Hoàn Toàn Lỗi Giao Diện Thừa & Mâu Thuẫn Logic (Clean Zero-Waste UI)**:
              + Khi tệp đã khóa được nạp vào Tab Khóa: Hệ thống TỰ ĐỘNG ẨN 100% Khối cài đặt khóa (Mẫu, Phân quyền, Định dạng xuất, Ô nhập mật khẩu mới và Nút bấm xanh "MÃ HÓA & LƯU TỆP").
              + Loại bỏ hoàn toàn sự xung đột gây bối rối giữa nút "Chuyển sang mở khóa" và nút "Mã hóa & lưu tệp".
            - **Thẻ Trạng Thái Hợp Nhất Chuyên Biệt (Dedicated Locked Card)**:
              + Hợp nhất 2 hộp rời rạc trước đây thành duy nhất 1 thẻ hiển thị sang trọng, viền vàng cam tinh tế.
              + Cung cấp 2 lựa chọn rõ ràng: `[ 🔓 MỞ KHÓA TỆP NÀY NGAY ]` (Chuyển sang giải mã) và `[ ✕ Bỏ chọn tệp ]` (Chọn tệp khác cần khóa).
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
