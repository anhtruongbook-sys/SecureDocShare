name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.6.1
          name: "KryptoDoc Enterprise Vault v2.6.1 - Strict Multi-Factor Vault Authentication"
          body: |
            ## Ứng dụng Di Động KryptoDoc Enterprise Vault v2.6.1 (Strict Multi-Factor Vault Authentication)
            - **Khắc Phục Tuyệt Đối Lỗi Bỏ Qua Xác Thực Khi Chuyển Sang Tab Két (Strict Vault Access Control)**:
              + Khắc phục triệt để lỗi logic bypass khiến Két tự động mở khóa khi chưa cấu hình mật khẩu hoặc do xung đột xác thực sinh trắc học lúc khởi động app.
              + Khi chuyển sang Tab Két (Tab 4): **BẮT BUỘC 100% hiển thị màn hình khóa Két (`🔒 KÉT ĐANG KHÓA`)**, yêu cầu xác nhận danh tính người dùng bằng một trong ba phương thức:
                1. Quét **Vân tay / Khuôn mặt (Biometrics)** qua cảm biến phần cứng Android.
                2. Nhập **Mã PIN Nhanh 4-6 số** trên bàn phím số (Mã PIN mặc định ban đầu: `0000`).
                3. Nhập **Mật khẩu Két Quản Trị (Master Password)** qua ô nhập mật khẩu an toàn.
              + Chỉ khi xác thực thành công mới mở khóa giao diện cấu hình (`🟢 Két Đang Mở Khóa`).
              + Tự động khóa Két lại ngay lập tức khi người dùng chuyển sang Tab khác hoặc bấm nút `🔒 Khóa Két Lại`.
              + Sửa lỗi fallback sinh trắc học Android native trả về `false` chuẩn xác khi người dùng hủy bỏ quét vân tay.
            - **Tái Thiết Kế Giao Diện Phẳng Hoàn Toàn & Sang Trọng (Pure Flat & Quiet Luxury Theme)**:
              + Học tập ngôn ngữ thiết kế từ các ứng dụng bảo mật hàng đầu thế giới (1Password 8, Apple Passwords iOS 18, Bitwarden, Proton Drive).
              + **Hệ màu Trung tính Titan (Neutral Titanium)**: Chế độ tối than đá ấm `#14171f`, chế độ sáng xám ngà canvas bột giấy cao cấp `#f4f5f8`, loại bỏ hoàn toàn viền neon và độ tương phản chói gắt.
              + **Thanh Điều Hướng Đáy 4 Mục (Bottom Navigation Bar)**: 🔒 Khóa, 🔓 Mở Khóa, 🔎 Pháp Y, 🛡️ Két – tiện dụng một ngón tay cái, loại bỏ triệt để tình trạng chật chội và chạm nhầm trên Header.
              + **Triết lý Tiết Lộ Cấp Tiến (Progressive Disclosure)**: Màn hình chính tối giản gọn gàng, các tùy chọn chuyên sâu (Watermark, Ký số, Quyền in, Mã định danh) được giấu tinh tế trong Accordion gập mở.
            - **Khắc Phục Hoàn Toàn Tương Phản Thông Báo Toast (Fix Toast Contrast)**:
              + Thiết kế lại Toast thông báo nổi bật siêu tương phản: Nền trắng tinh khiết viền xanh dương trên Light Mode, nền Slate tối chữ trắng trên Dark Mode.
            - **Động Cơ Đóng Dấu Bản Quyền Đa Định Dạng (Universal Cross-Format Watermarking)**:
              + **Văn bản Word (.docx)**: Nhúng VML shape chuẩn OpenXML nằm chìm sau văn bản (`behindDoc="1"`) hiển thị tự động trên mọi trang in và chế độ đọc.
              + **Bảng tính Excel (.xlsx)**: Nhúng ảnh nền sheet chuẩn OpenXML (`<picture r:id="..."/>`) trải đều trên toàn bộ bảng tính.
              + **Bản chiếu PowerPoint (.pptx)**: Nhúng trực tiếp vào Slide Master (`ppt/slideMasters/slideMaster1.xml`) bảo đảm hiển thị 100% trang chiếu và không thể xóa lẻ từng trang.
              + **Tài liệu Adobe PDF (.pdf)**: Đóng dấu mờ bán trong suốt 45 độ bằng iTextG native engine hiệu năng cao.
              + **Hình ảnh Đồ họa (.png, .jpg, .jpeg, .webp, .bmp)**: Hỗ trợ đóng dấu bản quyền trực tiếp bằng bộ giải mã Android Native Bitmap & Canvas compositing.
            - **Bộ Chọn Dấu Bản Quyền (Watermark Suite)**:
              + Tích hợp sẵn Logo IBST-BIM (Viện Khoa học Công nghệ Xây dựng) và Logo ANH'S TEAM dạng PNG trong suốt.
              + Hỗ trợ dấu chữ mờ tùy biến (CONFIDENTIAL, BẢN MẬT) và tải ảnh Watermark riêng từ bộ nhớ máy.
              + Tùy chỉnh độ mờ linh hoạt (15%, 25%, 35%).
            - **Kiểm Soát Quyền In Ấn (Allow Print Toggle)**:
              + Bổ sung tùy chọn cho phép hoặc cấm in ấn khi mở xem tự do (Chế độ Chỉ Xem / View-Only) chuẩn Adobe ISO 32000.
            - **Truy Vết Đối Tượng Tiếp Nhận (Recipient Tracking & Anti-Tamper)**:
              + Tự động gắn nhãn định danh phát hành (KD-2026-XXXX) và tên người nhận trực tiếp vào tài liệu.
              + Nhúng siêu dữ liệu ẩn vào PDF Catalog và OpenXML customXml chống xóa Properties và chống đổi tên.
            - **Tab Kiểm Định Pháp Y Số (Forensic Audit Engine)**:
              + Truy vết nguồn gốc phát hành, bóc tách mã định danh, người nhận và kiểm chuẩn tính toàn vẹn 100% khi nhận lại file.
            - **Mật Khẩu Chủ Quản Trị (Master Password)**:
              + Cơ chế Master Key cho phép quản trị viên/người phát hành cứu hộ và mở tất cả các tệp đã mã hóa bằng app.
            - **Bảo Vệ Ứng Dụng (App Lock, PIN Keypad & Hardware Biometrics)**:
              + Khóa ứng dụng với bàn phím mã PIN 4-6 số siêu tốc.
              + Tích hợp xác thực phần cứng máy: Cảm biến vân tay và nhận diện khuôn mặt (Android Keyguard).
            - **Chữ Ký Số & Con Dấu Điện Tử (Digital Signature PAdES)**:
              + Chèn con dấu điện tử, mộc két và chữ ký xác thực thời gian phát hành.
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
