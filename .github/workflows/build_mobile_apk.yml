name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureDocShare-mobile-release-apk
          path: build-output/SecureDocShare.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.19
          name: "SecureDocShare v1.0.19 (Android APK)"
          body: |
            ## Ứng dụng Di Động SecureDocShare Cài Đặt Trực Tiếp (Android APK v1.0.19)
            - **Giao Diện Nền Tối Hiện Đại (Dark Mode Mặc Định)**: Nền Obsidian Dark `#0b0f19` kết hợp thẻ Slate Navy `#131b2e` chống mỏi mắt và tiết kiệm pin tối đa cho màn hình OLED. Bổ sung nút chuyển đổi Sáng / Tối tiện lợi trên thanh tiêu đề.
            - **Khắc Phục Nhầm Lẫn Nút Bấm Lưu Tệp**: Bổ sung hộp thông báo trạng thái rõ ràng `✅ ĐÃ TỰ ĐỘNG LƯU VÀO MÁY`. Chuyển nút hành động chính thành `🚀 GỬI QUA ZALO / CHIA SẺ TỆP` và nút phụ `💾 Lưu thêm 1 bản sao khác`, chấm dứt hoàn toàn tình trạng bấm nhầm lưu trùng lặp 2 lần.
            - **Mã Hóa Microsoft Office Native 100% (ECMA-376 Standard Encryption)**: Khóa file Word (`.docx`), Excel (`.xlsx`), PowerPoint (`.pptx`) chuẩn gốc Microsoft Office, mở trực tiếp trên điện thoại bằng Microsoft Word/Excel hoặc WPS Office với hộp thoại hỏi mật khẩu bản quyền.
            - **Mã Hóa Adobe PDF Native (ISO 32000)**: Mở bằng mọi trình đọc PDF trên toàn cầu.
            - **Tải tệp APK**: Tải file `SecureDocShare.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: build-output/SecureDocShare.apk
          draft: false
          prerelease: false
