name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v3.0.3
          name: "Krypto v3.0.3 - Tự Động Nhận Diện Viền Thẻ & Tự Crop (Auto-Crop 1-Chạm) + Chụp Khung Thẻ ID-1"
          body: |
            ## Ứng dụng Di Động Krypto v3.0.3 (7-Tab Full Suite: Trang chủ • Mở khóa • Pháp y • Tri thức • Mật khẩu • 2FA OTP • Két sắt)
            - **Bổ sung Tự Động Nhận Diện 4 Viền Thẻ, Tự Xoay Ngang 90° & Tự Động Cắt (`🤖 Auto-Crop 1-Chạm`)**:
              + Tích hợp thuật toán thị giác máy tính **Sobel Edge Gradient + Độ lệch tương phản màu nền (`autoDetectCardBounds`)** tự động tìm 4 viền thẻ Ngân hàng / CCCD trên mặt bàn, lòng bàn tay hoặc ảnh chụp màn hình.
              + **Tự động xoay ngang 90°** nếu người dùng cầm dọc điện thoại chụp thẻ, tự động cắt sát 4 viền thẻ và tăng độ nét số thẻ dập nổi (`contrast(1.18)`) ngay lập tức chỉ với 1 chạm khi chụp hoặc chọn ảnh.
              + Tích hợp máy ảnh trực tiếp (`📷 Chụp & Tự Crop`) với khung ngắm viền xanh chuẩn thẻ tín dụng / CCCD (`ISO/IEC 7810 ID-1`, tỷ lệ `85.6 × 54 mm`), nút `📸 Camera (Tự Crop)` mở Camera hệ thống Android HD và nút `✂️ Tinh Chỉnh 4 Góc / Xoay` nếu muốn điều chỉnh thủ công.
            - **Tách riêng Phân hệ `🔑 Mật khẩu` (`#tab-passwords`) độc lập khỏi `🛡️ Két sắt` (`#tab-vault`)**:
              + Tách hoàn toàn Kho Mật Khẩu & Thẻ ra khỏi màn hình Cấu hình Két sắt & Chữ ký số HSM để tránh chồng chéo chức năng.
              + Tổ chức giao diện `🔑 Mật khẩu` thành **4 Sub-Tab ngang độc lập** (chỉ hiển thị duy nhất 1 chức năng tại một thời điểm):
                1. **`🗂️ Danh Bạ`**: Tìm kiếm tức thời, lọc theo danh mục (`🌐 Đăng nhập`, `💳 Thẻ NH`, `🪪 CCCD`, `📶 Wi-Fi`, `📝 Ghi chú / Ảnh`), sao chép 1 chạm, xem ảnh thẻ/screenshot và chụp thẻ `.PNG` ngay trong ứng dụng.
                2. **`➕ Thêm / Thẻ`**: Thêm mới bản ghi mật khẩu/thẻ, sinh mật khẩu ngẫu nhiên `CSPRNG` và đính kèm ảnh chụp mặt trước/mặt sau hoặc ảnh chụp màn hình.
                3. **`📷 Quét QR`**: Chọn ảnh chụp màn hình chứa mã QR, dán ảnh từ Clipboard hoặc nhập chuỗi `otpauth://`, `WIFI:S:...`, `CCCD Gắn chip 12 số`.
                4. **`☁️ Drive`**: Đồng bộ 2 chiều Google Drive qua `Android SAF PersistableUriPermission` + hợp nhất không mất dữ liệu `CRDT LWW-Element-Set`, xuất/nhập tệp `.kryptopass`, và bật/tắt chống chụp màn hình `FLAG_SECURE`.
            - **Tích hợp Phân hệ Kho Mật Khẩu Hậu Lượng Tử & Thẻ Tín Dụng / CCCD (`KryptoPasswordVault` — `NIST FIPS 203 ML-KEM-768` + `AES-256-GCM`)**:
              + Kiến trúc Mã hóa Phong bì 2 tầng (`PBKDF2-HMAC-SHA256` -> `HKDF-SHA256 RFC 5869` -> `KEK` bọc `DEK` -> `AES-256-GCM` với `AAD`) kết hợp Phong bì Khóa Hậu Lượng Tử `NIST FIPS 203 (ML-KEM-768)`.
              + Hỗ trợ 6 loại bản ghi đa hình chuẩn quốc tế: `LOGIN` (Tài khoản & 2FA TOTP), `PAYMENT_CARD` (Thẻ tín dụng Visa/Mastercard), `IDENTITY` (CCCD gắn chip 12 số & Hộ chiếu), `WIFI_NETWORK`, `SSH_API_KEY` (Seed Phrase 12/24 từ), `SECURE_NOTE`.
              + Hỗ trợ lưu ảnh chụp thẻ mặt trước/mặt sau (`front_image`, `back_image`), dán/chọn ảnh chụp màn hình (`screenshot_image`) và **Chụp Ảnh Thẻ Ngay Trong App (`app_card_snapshot` `.PNG`)** mã hóa `AES-256-GCM` độc lập.
              + Tích hợp Quét Mã QR Đa Định Dạng (`otpauth://`, `WIFI:S:...`, `CCCD Gắn chip 12 số|...`) và **Đồng bộ 2 chiều Google Drive qua Android SAF (`PersistableUriPermission`) + Hợp nhất không mất dữ liệu `CRDT LWW-Element-Set`**.
              + Bổ sung tùy chọn bật/tắt bảo vệ chống chụp màn hình hệ thống (`Android WindowManager.LayoutParams.FLAG_SECURE`).
            - **Thiết kế lại toàn diện Giao Diện Quét Mã QR Phẳng Toàn Màn Hình (`Full-Screen Flat QR Scanner`)**:
              + Thay thế hộp thoại popup nhỏ hẹp cũ bằng giao diện phẳng tràn viền toàn màn hình (`100vw x 100dvh`), không lồng thẻ, hiển thị luồng máy ảnh độ phân giải cao sắc nét.
              + Mở rộng vùng ngắm quét mã QR lên kích thước lớn (`min(82vw, 330px)` — diện tích lớn gấp 4 lần khung cũ) với 4 góc định vị phẳng sắc nét và tia quét ngang tự động.
              + Tích hợp thanh điều khiển phẳng phía trên (**`← Đóng`**, **`🔦 Đèn Flash`** bật/tắt trực tiếp trên phần cứng Camera2, **`🔄 Lật`** máy ảnh trước/sau) và thanh tác vụ phẳng 3 nút phía dưới (**`🖼️ Chọn ảnh QR`**, **`📸 Chụp nét cao`**, **`⌨️ Nhập khóa tay`**).
              + Bổ sung thuật toán quét kép (`Dual-Pass Multi-Zone jsQR`) vừa quét toàn khung hình vừa cắt vùng trung tâm để nhận diện tức thời cả mã QR cỡ lớn lẫn mã QR nhỏ trên màn hình máy tính/điện thoại.
            - **Khôi phục đầy đủ Tab `🧠 Tri thức` (`Kho Tri Thức & Phân Tích Link Share`)**:
              + Lưu giữ, bóc tách phụ đề/nội dung và phân tích thông minh các đường link chia sẻ trực tiếp (`Intent.ACTION_SEND`) từ **YouTube** (`[mm:ss]` transcript wisdom), **GitHub**, **Facebook**, **Zalo**, và **Trình duyệt Web** với cơ chế lưu trữ bền vững 3 lớp (`Triple-Persistence`).
              + Tích hợp đồng thời đầy đủ cả 6 phân hệ trên thanh điều hướng dưới cùng: **`🏠 Trang chủ` • `🔓 Mở khóa` • `🔎 Pháp y` • `🧠 Tri thức` • `🔢 2FA OTP` • `🛡️ Két sắt`**.
            - **Khắc phục lỗi ẩn Modal Quét QR (`.cyber-dialog-overlay.active.show`)**:
              + Bổ sung gán lớp `.active.show` và `opacity: 1; pointer-events: auto;` khi mở hộp thoại `#kauth-camera-modal-overlay` và `#kauth-qr-modal-overlay`, đồng thời đưa hộp thoại ra cấp gốc `<body>` để hiển thị nổi hoàn toàn trên mọi thiết bị.
            - **Nâng cấp Động cơ Máy ảnh Phần cứng lên chuẩn `Android Camera2 API` (`android.hardware.camera2`)**:
              + Sử dụng trực tiếp `CameraManager` + `ImageReader (YUV_420_888)` trên luồng độc lập `HandlerThread` với cơ chế giải phóng buffer tức thời (`img.close()`), tương thích 100% với Samsung One UI (HAL3) mà không bị nghẽn `SurfaceTexture`.
            - **Khắc phục triệt để lỗi Máy ảnh trên Android WebView (`file://` Non-Secure Context)**:
              + Do ứng dụng hoạt động Offline 100% qua giao thức `file:///android_asset/...`, trình duyệt Chromium WebView chặn `navigator.mediaDevices.getUserMedia` và `FilePicker` ghi đè `<input type="file">`.
              + Đã tích hợp **Cầu nối Máy ảnh Phần cứng Native Android** trực tiếp trong `MainActivity.kt` (`android.hardware.Camera` + `SurfaceTexture` + `YuvImage` tự động lấy nét liên tục `FOCUS_MODE_CONTINUOUS_PICTURE` + xoay khung hình chuẩn xác theo cảm biến) truyền luồng hình ảnh thời gian thực sang `Canvas` + `jsQR` để quét mã QR trực tiếp.
              + Bổ sung lệnh `captureQrPhotoNative` gọi trực tiếp `MediaStore.ACTION_IMAGE_CAPTURE` của hệ thống Android khi bấm **`📸 Chụp Ảnh QR`**.
            - **Loại bỏ 100% Tài Khoản & Dữ Liệu Giả Định (`Zero Dummy Accounts`)**:
              + Xóa sạch toàn bộ các tài khoản mẫu giả định (`IBST-BIM CDE`, `Google security@anhsteam.vn`, `GitHub anhsteam-dev`, `Krypto HSM Root`, `Hardware Token HOTP`) và tự động dọn sạch dữ liệu mẫu cũ trong bộ nhớ thiết bị.
              + Chỉ hiển thị duy nhất thẻ `Krypto HSM` thật của người dùng và các tài khoản 2FA do chính người dùng quét QR hoặc thêm vào.
              + Loại bỏ toàn bộ giá trị điền sẵn giả định trong tab Giải Phẫu & Ký Giao Dịch OCRA.
            - **Tích hợp Quét Mã QR Trực Tiếp Bằng Máy Ảnh (`Live Camera QR Scanner — Offline 100%`)**:
              + Bổ sung chế độ **`📷 Quét QR Máy Ảnh`** trực tiếp ngay tại màn hình chính `2FA OTP` và mục `➕ Thêm / QR` (hỗ trợ tự động xin quyền Camera Android, chuyển đổi Camera trước/sau và tự động bắt nét giải mã tức thời chuẩn `otpauth://` và `otpauth-migration://` của Google Authenticator).
              + Bổ sung nút **`📸 Chụp / Chọn Ảnh QR`** (mở trực tiếp ứng dụng Máy ảnh hệ thống để chụp mã QR nét cao hoặc chọn ảnh từ thư viện kèm thuật toán giải mã đa tỷ lệ `Multi-Scale jsQR`).
            - **Tích hợp Bộ Xác Thực Đa Nhân Tố Krypto Authenticator (`2FA / MFA Offline 100%`)**:
              + Hỗ trợ đầy đủ chuẩn `IETF RFC 4226 (HOTP)`, `RFC 6238 (TOTP — SHA1/SHA256/SHA512, 6/8 số)`, và ký xác thực giao dịch theo ngữ cảnh `RFC 6287 (OCRA)`.
              + Tự động liên kết và ghim hạt giống 2FA của Buồng HSM Cá Nhân (`Krypto HSM PKCS#11`) ngay đầu danh sách.
              + Hỗ trợ nhập/xuất hai chiều với Google Authenticator qua định dạng chuẩn `otpauth://` và chuỗi nhị phân `Protocol Buffers` (`otpauth-migration://offline?data=...`).
              + Bảo vệ danh bạ khóa 2FA bằng tệp két sắt `.kryptovault` (`PBKDF2-HMAC-SHA256 600.000 vòng` + `AES-256-GCM`).
            - **Zero Hardcoded Key & Zero Hidden Anchor (`FIPS 140-3` & `OASIS PKCS#11 v3.0`)**:
              + Xóa bỏ hoàn toàn khóa nhúng tĩnh và khóa neo ngầm (`device_anchor_wrapped`).
              + Cặp khóa `ECDSA P-256` được sinh ngẫu nhiên 100% ngay trên thiết bị (`On-Device CSPRNG`) và chỉ bọc bởi `USER_PIN` + `SO_PIN` (`PBKDF2-HMAC-SHA512 250.000 vòng lặp` + `AES-256-GCM`).
              + Thực thi cơ chế xóa trắng vùng nhớ chứa khóa rõ ngay sau khi ký (`FIPS 140-3 Zeroization`: `privBytes.fill(0)`, `slotMasterKey.fill(0)`).
            - **Giữ Nguyên Khóa & Tái Ký Chứng Thư Số (`NIST SP 800-57 Key Retention` & `IETF RFC 5280`)**:
              + Một khi Buồng HSM đã được khởi tạo trên thiết bị, cặp khóa và số Serial HSM được lưu bền vững 2 tầng (`localStorage` + tệp vĩnh viễn Native Android) và giữ cố định 100%.
              + Mọi thao tác cập nhật Hồ sơ (Họ tên, Email, Chức danh) bắt buộc xác thực đúng `USER_PIN` (hoặc `SO_PIN`) và tái ký cấu trúc `TBSCertificate` (`cert_signature_b64`) trên cùng cặp khóa đó.
            - **Buồng Chữ Ký Số Cá Nhân Chuẩn HSM (`PKCS#11` `CKA_EXTRACTABLE = FALSE`)**:
              + Khởi tạo và quản lý Chứng thư số X.509v3 cá nhân ngay trong Két sắt Krypto, bảo vệ bằng `USER_PIN`, `SO_PIN/PUK` (tự động khóa cứng sau 5 lần nhập sai PIN) và mã `TOTP 6 số` (`RFC 6238`) trên điện thoại.
            - **Gắn liền Chữ Ký Tay Chính Thức (`Chu ky TA.png` nền trong suốt, mực hành chính `#003399`)**:
              + Nhúng sẵn mẫu chữ ký tay chính thức `Chu ky TA.png` vào đối tượng `CKO_DATA` của HSM và khóa mã băm `SHA-256` (`f725d40806e86a9c...`) trong trường mở rộng X.509v3.
              + Hỗ trợ tách nền trong suốt tự động (`Adaptive Alpha Matting`) từ ảnh chụp chữ ký tay bất kỳ và dàn trang con dấu chữ ký `PAdES-HSM` sắc nét lên tài liệu PDF.
            - **Cơ chế Đổi Điện Thoại & Đổi PC 1 Chạm (`.kryptohsm` `PKCS#11 C_WrapKey / C_UnwrapKey`)**:
              + Xuất và khôi phục trọn vẹn Buồng HSM + Số Serial Chứng thư + Ảnh chữ ký tay `.png` + Cấu hình TOTP sang Điện thoại mới hoặc PC mới.
            - **Tích hợp Email Ký Số Chuẩn `S/MIME (RFC 8551)`**:
              + Hỗ trợ tạo và xuất gói Email Yêu cầu ký số & Email Trả kết quả đã ký số (`.eml` kèm chữ ký số `smime.p7s` từ HSM).
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
