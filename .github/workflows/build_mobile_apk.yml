name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.5
          name: "KryptoDoc v2.3.5 - True View-Only Read-Only Protection for PDF & Office (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.3.5 (Chuẩn Hóa Chế Độ Chỉ Xem Không Cần Mật Khẩu Mở Cho PDF & Office)
            - **Chế Độ Chỉ Xem Chuẩn Quốc Tế Cho Tệp PDF (Adobe ISO 32000)**:
              + Người nhận mở xem tự do 100% không bị yêu cầu nhập bất kỳ mật khẩu nào trên mọi ứng dụng (Adobe Acrobat, Foxit Reader, WPS Office, Samsung PDF, Xiaomi Reader, Trình duyệt Web).
              + Khóa chặt quyền sao chép văn bản (ALLOW_COPY = 0), cấm chỉnh sửa nội dung, cấm trích xuất dữ liệu.
              + Chỉ người tạo tệp giữ mật khẩu để gỡ bỏ bảo vệ.
            - **Chế Độ Chỉ Xem Chuẩn Microsoft Office Native (Word .docx & Excel .xlsx)**:
              + Áp dụng chuẩn bảo vệ tài liệu nguyên bản Microsoft OOXML Document Protection (SHA-512).
              + Mở xem tự do 100% trên Microsoft Word, Excel và WPS Office mà KHÔNG bắt nhập mật khẩu mở tệp!
              + Khóa cứng nội dung văn bản và bảng tính chống chỉnh sửa, chống sửa ô, chống thay đổi cấu trúc sheet.
              + Mật khẩu do người tạo lưu giữ để mở khóa chỉnh sửa (Unprotect Document / Sheet).
            - **Chế Độ Khóa Mật Khẩu (Password to Open)**:
              + Tiếp tục duy trì chuẩn mã hóa cấp quân sự MS-OFFCRYPTO Binary Encryption (Word/Excel) và Adobe AES/RC4-128bit (PDF), bắt buộc nhập đúng mật khẩu mới mở được nội dung tệp.
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
