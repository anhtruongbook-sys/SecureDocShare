name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.0
          name: "KryptoDoc v2.2.0 - Security Templates, Watermark & Offline QR Vault (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.2.0 (Giai Đoạn 3: Đỉnh Cao Bảo Mật & Tiện Ích Độc Quyền)
            - **Mẫu Cấu Hình Bảo Mật 1-Chạm (Context Security Templates)**:
              + 🏢 *Hợp Đồng Doanh Nghiệp*: Khóa mật khẩu quân sự + Đóng dấu mờ "BẢN MẬT HỢP ĐỒNG".
              + 📐 *Bản Vẽ & Bản Quyền Thiết Kế*: Chế độ Chỉ xem (Cấm sao chép / cấm in) + Đóng dấu mờ "BẢN QUYỀN THIẾT KẾ".
              + 💰 *Báo Giá / Dự Toán*: Mật khẩu nhanh + Tự động nén tối ưu dung lượng gửi Zalo.
            - **Đóng Dấu Bản Quyền Mờ Chuyên Nghiệp (Watermark Overlay)**:
              + Tự động khắc dấu chéo 45° mờ tinh tế (18% Opacity) xuyên suốt toàn bộ các trang tài liệu PDF bằng động cơ Native iTextG & Syncfusion PDF.
              + Cung cấp sẵn các mẫu dấu chuẩn mực: "BẢN MẬT - NỘI BỘ", "CHỈ LƯU HÀNH NỘI BỘ", "BẢN THẢO - TUYỆT MẬT", hoặc nhập tùy biến.
            - **Nén Tối Ưu Tệp Tự Động (Smart Full-Stream Compression)**: Nén stream tệp PDF giúp giảm kích thước đáng kể, truyền gửi qua Zalo / Email tức thì mà không lo nghẽn mạng.
            - **Mã QR Chia Sẻ Mật Khẩu Siêu Tốc Offline 100% (Instant Password QR Code)**:
              + Tự động sinh mã QR độ nét cao ngay trên màn hình kết quả.
              + Đối tác / đồng nghiệp chỉ cần đưa camera điện thoại hoặc Zalo quét là nhận ngay mật khẩu mà không sợ bị lộ trong tin nhắn chat.
            - **Thước Đo Độ Mạnh Mật Khẩu & Bộ Sinh Mật Khẩu Quân Sự 16 Ký Tự**: Đảm bảo an toàn cấp quân sự.
            - **Biểu tượng Cyber Shield Động Tương Tác**: Xoay radar orbital ring, phát quang neon, nảy haptic 3D.
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` (hoặc `SecureDocShare.apk`) bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
