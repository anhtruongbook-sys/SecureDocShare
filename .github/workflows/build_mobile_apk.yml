name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.8.5
          name: "Krypto v2.8.5 - Bóc Tách Toàn Văn Bài Viết Facebook & Web SPA + Tự Động Khôi Phục Bản Ghi Rỗng"
          body: |
            ## Ứng dụng Di Động Krypto v2.8.5 (PQC ML-KEM-768 + Chat Knowledge Vault v3.5)
            - **Khắc phục triệt để lỗi xử lý liên kết Facebook (`facebook.com/share/...`, `posts/...`) và trang Web SPA bị rỗng (`0 đoạn nội dung`)**:
              + **Nguyên nhân gốc rễ đã xử lý**:
                1. Trước đây tầng Native `HttpClient` trong `chat_vault_bridge.dart` chưa gán `client.userAgent` nên khi liên kết rút gọn `facebook.com/share/...` chuyển hướng `302 Redirect` sang đường dẫn bài viết thật, `User-Agent` bị mất về mặc định khiến Facebook trả về trang khung đăng nhập rỗng.
                2. Bộ nạp cũ xóa toàn bộ thẻ `<script>` và chỉ quét thẻ `<p>`, trong khi bài viết Facebook lưu toàn văn nội dung trong cấu trúc Relay JSON (`"text":"..."`) và thẻ `<meta property="og:description">`.
              + **Bộ bóc tách chuyên sâu Facebook & Web (`extractFacebookPostCard` + `parseStructuredArticleSections`)**:
                * Bảo toàn `User-Agent` và `Accept-Language` xuyên suốt mọi bước Redirect 301/302 ở tầng Native Dart.
                * Bóc tách 100% toàn văn bài viết dài từ Relay JSON (ví dụ bài viết 4.072 từ / 39 đoạn / 7 phần chuyên sâu từ liên kết `facebook.com/share/14uahV2kXCc/`), nhận diện chính xác tác giả gốc & người chia sẻ (`Ky Vu — Chia sẻ bởi: Lộc Đặng`).
                * Tự động phân tách các tiêu đề phần (IN HOA, Markdown, đánh số) để tổng hợp mạch lạc `Thông điệp trọng tâm`, `Bức tranh tổng thể`, `Mục lục phần`, `Nội dung cốt lõi theo từng phần`, `Đúc kết sâu` và `Khuyến nghị hành động`.
              + **Tự động khôi phục bản ghi rỗng đã lưu trước đó (`Auto-Heal Empty Records`)**: Tự động phát hiện các bản ghi có `0 đoạn nội dung` trong máy để bóc tách và cập nhật lại toàn văn ngay khi mở ứng dụng hoặc khi bấm xem chi tiết.
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
