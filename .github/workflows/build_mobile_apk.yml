name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.1
          name: "Krypto v2.9.1 - Quét Mã QR Trực Tiếp Bằng Máy Ảnh & Loại Bỏ Tài Khoản Giả Định (100% Production Clean)"
          body: |
            ## Ứng dụng Di Động Krypto v2.9.1 (Live Camera QR Scanner + Zero Dummy Accounts + Integrated 2FA Authenticator)
            - **Loại bỏ 100% Tài Khoản & Dữ Liệu Giả Định (`Zero Dummy Accounts`)**:
              + Xóa sạch toàn bộ các tài khoản mẫu giả định (`IBST-BIM CDE`, `Google security@anhsteam.vn`, `GitHub anhsteam-dev`, `Krypto HSM Root`, `Hardware Token HOTP`) và tự động dọn sạch dữ liệu mẫu cũ trong bộ nhớ thiết bị.
              + Chỉ hiển thị duy nhất thẻ `Krypto HSM` thật của người dùng và các tài khoản 2FA do chính người dùng quét QR hoặc thêm vào.
              + Loại bỏ toàn bộ giá trị điền sẵn giả định trong tab Giải Phẫu & Ký Giao Dịch OCRA.
            - **Tích hợp Quét Mã QR Trực Tiếp Bằng Máy Ảnh (`Live Camera QR Scanner — Offline 100%`)**:
              + Bổ sung chế độ **`📷 Quét QR Máy Ảnh`** trực tiếp ngay tại màn hình chính `2FA OTP` và mục `➕ Thêm / QR` (hỗ trợ tự động xin quyền Camera Android, chuyển đổi Camera trước/sau và tự động bắt nét giải mã tức thời chuẩn `otpauth://` và `otpauth-migration://` của Google Authenticator).
              + Bổ sung nút **`📸 Chụp / Chọn Ảnh QR`** (mở trực tiếp ứng dụng Máy ảnh hệ thống để chụp mã QR nét cao hoặc chọn ảnh từ thư viện kèm thuật toán giải mã đa tỷ lệ `Multi-Scale jsQR`).
            - **Tích hợp Bộ Xác Thực Đa Nhân Tố Krypto Authenticator (`2FA / MFA Offline 100%`)**:
              + Hỗ trợ đầy đủ chuẩn `IETF RFC 4226 (HOTP)`, `RFC 6238 (TOTP — SHA1/SHA256/SHA512, 6/8 số)`, và ký xác thực giao dịch theo ngữ cảnh `RFC 6287 (OCRA)`.
              + Tự động liên kết và ghim hạt giống 2FA của Buồng HSM Cá Nhân (`Krypto HSM PKCS#11`) ngay đầu danh sách.
              + Hỗ trợ nhập/xuất hai chiều với Google Authenticator qua định dạng chuẩn `otpauth://` và chuỗi nhị phân `Protocol Buffers` (`otpauth-migration://offline?data=...`).
              + Bảo vệ danh bạ khóa 2FA bằng tệp két sắt `.kryptovault` (`PBKDF2-HMAC-SHA256 600.000 vòng` + `AES-256-GCM`).
            - **Zero Hardcoded Key & Zero Hidden Anchor (`FIPS 140-3` & `OASIS PKCS#11 v3.0`)**:
              + Xóa bỏ hoàn toàn khóa nhúng tĩnh và khóa neo ngầm (`device_anchor_wrapped`).
              + Cặp khóa `ECDSA P-256` được sinh ngẫu nhiên 100% ngay trên thiết bị (`On-Device CSPRNG`) và chỉ bọc bởi `USER_PIN` + `SO_PIN` (`PBKDF2-HMAC-SHA512 250.000 vòng lặp` + `AES-256-GCM`).
              + Thực thi cơ chế xóa trắng vùng nhớ chứa khóa rõ ngay sau khi ký (`FIPS 140-3 Zeroization`: `privBytes.fill(0)`, `slotMasterKey.fill(0)`).
            - **Giữ Nguyên Khóa & Tái Ký Chứng Thư Số (`NIST SP 800-57 Key Retention` & `IETF RFC 5280`)**:
              + Một khi Buồng HSM đã được khởi tạo trên thiết bị, cặp khóa và số Serial HSM được lưu bền vững 2 tầng (`localStorage` + tệp vĩnh viễn Native Android) và giữ cố định 100%.
              + Mọi thao tác cập nhật Hồ sơ (Họ tên, Email, Chức danh) bắt buộc xác thực đúng `USER_PIN` (hoặc `SO_PIN`) và tái ký cấu trúc `TBSCertificate` (`cert_signature_b64`) trên cùng cặp khóa đó.
            - **Buồng Chữ Ký Số Cá Nhân Chuẩn HSM (`PKCS#11` `CKA_EXTRACTABLE = FALSE`)**:
              + Khởi tạo và quản lý Chứng thư số X.509v3 cá nhân ngay trong Két sắt Krypto, bảo vệ bằng `USER_PIN`, `SO_PIN/PUK` (tự động khóa cứng sau 5 lần nhập sai PIN) và mã `TOTP 6 số` (`RFC 6238`) trên điện thoại.
            - **Gắn liền Chữ Ký Tay Chính Thức (`Chu ky TA.png` nền trong suốt, mực hành chính `#003399`)**:
              + Nhúng sẵn mẫu chữ ký tay chính thức `Chu ky TA.png` vào đối tượng `CKO_DATA` của HSM và khóa mã băm `SHA-256` (`f725d40806e86a9c...`) trong trường mở rộng X.509v3.
              + Hỗ trợ tách nền trong suốt tự động (`Adaptive Alpha Matting`) từ ảnh chụp chữ ký tay bất kỳ và dàn trang con dấu chữ ký `PAdES-HSM` sắc nét lên tài liệu PDF.
            - **Cơ chế Đổi Điện Thoại & Đổi PC 1 Chạm (`.kryptohsm` `PKCS#11 C_WrapKey / C_UnwrapKey`)**:
              + Xuất và khôi phục trọn vẹn Buồng HSM + Số Serial Chứng thư + Ảnh chữ ký tay `.png` + Cấu hình TOTP sang Điện thoại mới hoặc PC mới.
            - **Tích hợp Email Ký Số Chuẩn `S/MIME (RFC 8551)`**:
              + Hỗ trợ tạo và xuất gói Email Yêu cầu ký số & Email Trả kết quả đã ký số (`.eml` kèm chữ ký số `smime.p7s` từ HSM).
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
