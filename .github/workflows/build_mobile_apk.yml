name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.7.9
          name: "Krypto v2.7.9 - Tổng Hợp Tri Thức Mạch Lạc Chuẩn v3 (YouTube Chapter Synthesis & GitHub README AST)"
          body: |
            ## Ứng dụng Di Động Krypto v2.7.9 (PQC ML-KEM-768 + Chat Knowledge Vault v3.0)
            - **Tổng Hợp Nội Dung Mạch Lạc & Có Cấu Trúc (`ChatVaultEngine v3.0`)**:
              + **GitHub Repository (`extractGitHubRepoCard`)**: Gọi trực tiếp GitHub REST API kết hợp tải nguyên bản `README.md` (Markdown), phân tích cấu trúc từng đề mục (`# / ## / ###`), bảng biểu và nguyên lý thiết kế để tổng hợp **Thông điệp trọng tâm**, **Bức tranh tổng thể** và **Nội dung chính theo từng Mục** — loại bỏ hoàn toàn lỗi quét nhầm Menu giao diện và React JSON của trang GitHub.
              + **YouTube Video (`extractYouTubeIdeaCard`)**: Tái tạo câu văn hoàn chỉnh từ phụ đề (không cắt ngang câu 30 giây), khử từ đệm hội thoại (`filler words`) và lọc bỏ link quảng cáo (`sponsor links`), tổng hợp mạch lạc **Nội dung cốt lõi theo từng Chương mục** và **Tổng quan toàn video**.
              + **Tự động nâng cấp dữ liệu cũ (`Schema v3 Auto-Upgrade`)**: Tự động làm sạch và bóc tách lại các bản ghi rời rạc từ phiên bản cũ trong bộ nhớ thiết bị ngay khi mở ứng dụng, đồng thời bổ sung nút **`🔄 Tóm tắt lại`** trong trang Chi tiết.
            - **Song Ngữ (`🇻🇳 Tiếng Việt` Mặc Định | Chuyển Đổi `🇬🇧 English`) & Tự Động Xử Lý Khi Chia Sẻ Link (`Share -> Krypto`)**.
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
