name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.7.7
          name: "Krypto v2.7.7 - Tích Hợp Kho Lưu Trữ & Tra Cứu Tri Thức Chat (YouTube / GitHub / Web / Ghi Chú)"
          body: |
            ## Ứng dụng Di Động Krypto v2.7.7 (PQC ML-KEM-768 + Chat Knowledge Vault)
            - **Tích Hợp Tab 5 `🧠 Tri thức` (Chat Knowledge Vault v1.1)**:
              + Tự động bóc tách phụ đề video YouTube kèm mốc thời gian `[mm:ss]` qua giao thức Innertube Android (`com.google.android.youtube/20.10.38`) không cần API Key.
              + Tự động tra cứu GitHub Repository (`README.md`, Stars, Ngôn ngữ), bài báo Web và ghi chú tin nhắn Chat.
              + Chấm điểm `TF-IDF` bất đồng bộ (Chunked Non-blocking) để chắt lọc Ý tưởng cốt lõi (`Core Ideas`), Đúc kết sâu (`Key Insights`) và tự động gắn thẻ phân loại 6 chuyên ngành.
              + Tìm kiếm toàn văn (`BM25` + khử dấu tiếng Việt) định vị chính xác câu nói tại mốc `[mm:ss]` trong video YouTube.
              + **Kiến trúc Sao lưu 3 lớp (`Triple-Persistence`)**: Đồng bộ tự động giữa `IndexedDB`, bộ nhớ nội bộ ứng dụng và `/storage/emulated/0/Download/ChatKnowledgeVault/vault_master_backup.json` giúp giữ nguyên dữ liệu khi gỡ hoặc cài đặt lại APK.
              + Hỗ trợ nhận chia sẻ đường dẫn trực tiếp từ Zalo, YouTube, Trình duyệt qua menu **Chia sẻ (Share) -> Krypto**.
            - **Kế thừa toàn diện v2.7.6**: Mật mã Hậu lượng tử `ML-KEM-768` (FIPS 203) + `AES-256-GCM` + `PQC Master Key Escrow`, Bảng Responsive chuẩn thẻ đơn (Rule 14).
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
