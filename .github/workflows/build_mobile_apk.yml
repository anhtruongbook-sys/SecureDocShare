name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.8.4
          name: "Krypto v2.8.4 - Dịch Tiếng Việt 100% Cho GitHub & YouTube (Khắc Phục Nhận Diện Sai Nhãn Tiếng Việt + Tự Động Dịch Lại Bản Ghi Cũ)"
          body: |
            ## Ứng dụng Di Động Krypto v2.8.4 (PQC ML-KEM-768 + Chat Knowledge Vault v3.4)
            - **Khắc phục triệt để lỗi bản ghi GitHub / YouTube vẫn hiển thị tiếng Anh khi đang chọn `🇻🇳 VI`**:
              + **Nguyên nhân gốc rễ đã xử lý**: Trước đây hàm `extractGitHubRepoCard` ghép nhãn tiếng Việt (`"Ngôn ngữ:"`, `"Mục tiêu dự án:"`) vào văn bản tiếng Anh trước khi kiểm tra ngôn ngữ bằng `VI_DIACRITIC_REGEX.test(...)`, khiến bộ kiểm tra tưởng nhầm toàn bộ đoạn tiếng Anh đã là tiếng Việt và bỏ qua bước dịch.
              + **Bộ nhận diện tỷ lệ từ Tiếng Việt thực chất (`isPrimarilyVietnamese` >= 16%)**: Loại bỏ các nhãn giao diện hệ thống và tính tỷ lệ từ có dấu tiếng Việt thực tế trên toàn văn bản trước khi quyết định dịch.
              + **Tự động dịch lại ngay các bản ghi cũ bị lưu tiếng Anh (`Auto-Heal Untranslated VI Records`)**: Khi mở ứng dụng hoặc bấm xem chi tiết một bản ghi cũ (như `K-Dense-AI/scientific-agent-skills`), nếu phát hiện `i18n.vi` đang là tiếng Anh, hệ thống tự động dịch toàn bộ tiêu đề, thông điệp trọng tâm, tổng quan và các luận điểm sang Tiếng Việt ngay lập tức.
            - **Kế thừa toàn diện v2.8.3**: Tự động lưu khi Share từ GitHub/YouTube/Zalo (`singleTask` + `ClipData`), phát hiện trùng lặp 3 tầng, tự động nhóm theo 10 chủ đề.
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
