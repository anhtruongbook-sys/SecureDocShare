name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.8.0
          name: "Krypto v2.8.0 - Xuất Tệp .MD / .JSON Chuẩn Android MediaStore Downloads & Mở/Chia Sẻ Ngay 1 Chạm"
          body: |
            ## Ứng dụng Di Động Krypto v2.8.0 (PQC ML-KEM-768 + Chat Knowledge Vault v3.0)
            - **Lưu Tệp `.md` / `.json` Qua Chuẩn Android `MediaStore.Downloads` (`MainActivity.kt`)**:
              + Sử dụng `ContentResolver` + `MediaStore.Downloads.EXTERNAL_CONTENT_URI` (Android 10–15 Scoped Storage) kết hợp `MediaScannerConnection.scanFile` để tệp `.md` và `.json` xuất ra hiển thị **ngay lập tức** ở đầu mục **Tệp gần đây (Recent)** và **Tải về (Downloads)** trong ứng dụng **File của bạn (My Files)** trên điện thoại Samsung/Android.
              + Sau khi lưu thành công, hiển thị hộp thoại xác nhận đường dẫn chính xác kèm nút **`📤 Mở / Chia Sẻ Ngay`** để mở trực tiếp hoặc gửi qua Zalo, Samsung Notes, Google Drive chỉ với 1 chạm.
            - **Kế thừa toàn diện v2.7.9**: Tổng hợp tri thức mạch lạc chuẩn v3 (YouTube Chapter Synthesis & GitHub README AST), Song ngữ Việt - Anh (`🇻🇳 Tiếng Việt` mặc định) và Tự động xử lý khi chia sẻ link (`Share -> Krypto`).
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
