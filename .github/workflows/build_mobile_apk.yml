name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.8.3
          name: "Krypto v2.8.3 - Tự Động Bóc Tách & Lưu Ngay Khi Share Link Từ GitHub, YouTube, Chrome, Zalo (SingleTask + ClipData Intent)"
          body: |
            ## Ứng dụng Di Động Krypto v2.8.3 (PQC ML-KEM-768 + Chat Knowledge Vault v3.3)
            - **Khắc phục triệt để lỗi Share Link từ ứng dụng GitHub / YouTube / Chrome / Zalo không tự lưu (`Auto-Save on Share Intent`)**:
              + **Kiến trúc `android:launchMode="singleTask"`**: Đảm bảo toàn hệ điều hành chỉ duy nhất 1 tiến trình `MainActivity` hoạt động, đưa thẳng phiên Krypto đang chạy ngầm lên tiền cảnh (`onNewIntent`) thay vì mở chồng Activity thứ hai trong Task của GitHub (tránh khóa cơ sở dữ liệu `IndexedDB`).
              + **Bóc tách toàn diện `Intent` / `ClipData` / `CharSequence` (`MainActivity.kt`)**: Đọc đầy đủ `getCharSequenceExtra(EXTRA_TEXT)`, `ClipData.Item` (`text`, `uri`, `coerceToText`), `ACTION_SEND`, `ACTION_SEND_MULTIPLE` và `text/*` từ Android ShareSheet (Android 12–15 & GitHub Mobile App).
              + **Khóa chống xung đột khởi tạo kép (`Single-Flight Mount Mutex`)**: Loại bỏ hiện tượng `DOMContentLoaded` và `switchTab('knowledge')` gọi `ChatVaultAdapter.mount()` song song làm mất liên kết vừa chia sẻ.
              + **Tối ưu tốc độ dịch song ngữ theo lô (`Chunked Parallel Translation`)**: Chia nhỏ chuỗi dịch `<= 1300` ký tự chạy song song, rút ngắn thời gian bóc tách và dịch `README.md` từ GitHub xuống dưới 1.5 giây.
            - **Kế thừa toàn diện v2.8.2**: Phát hiện trùng lặp 3 tầng (`>= 72%`), tự động nhận dạng & nhóm theo 10 chủ đề, xuất tệp `.md` vào `Download/` kèm hộp thoại Mở/Chia sẻ ngay.
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
