name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.7
          name: "KryptoDoc v2.3.7 - Premium Cyber Modal System & UX Polish (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.3.7 (Hệ Thống Hộp Thoại Cyber Dialog & Tối Ưu UX)
            - **Loại Bỏ Hoàn Toàn Hộp Thoại Alert Trình Duyệt Thô Ráp**:
              + Thay thế 100% các hộp thoại `window.alert` trắng toát, đơn điệu của Android WebView bằng Cyber Modal Dialog sang trọng.
              + Hiệu ứng mờ nền kính (Backdrop Blur), quầng sáng hào quang (Cyber Glow Aura) đồng bộ chuẩn Obsidian Dark & Clean Light.
              + Tự động rung viền nổi bật (`input-attention-pulse`) và trỏ con trỏ vào ô nhập mật khẩu khi người dùng quên nhập mật khẩu.
            - **Bảo Vệ Tệp Cấp Quân Sự Offline 100%**:
              + Tích hợp đầy đủ Động cơ Pure Native ZIP Streaming ISO/IEC 29500 cho Office (Word, Excel) và Adobe ISO 32000 cho PDF.
              + Mã hóa tệp tin an toàn tuyệt đối, không gửi bất kỳ dữ liệu nào qua Internet.
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
