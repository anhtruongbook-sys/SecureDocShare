name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/Krypto.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Krypto-mobile-release-apk
          path: build-output/Krypto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.7.6
          name: "Krypto v2.7.6 - Tích Hợp Mật Mã Hậu Lượng Tử (ML-KEM-768 FIPS 203 + PQC Master Key)"
          body: |
            ## Ứng dụng Di Động Krypto v2.7.6 (Post-Quantum Cryptography ML-KEM-768 & Master Key Escrow)
            - **Tích Hợp Thuật Toán Mật Mã Hậu Lượng Tử Tiên Tiến Nhất (NIST FIPS 203 ML-KEM-768)**:
              + Tích hợp động cơ `PQCCryptoEngine` (`SECDOC_PQC_V2`) kết hợp bọc khóa lưới đa thức vành `R_q = Z_3329[X]/(X^256 + 1)` (`ML-KEM-768`) với `AES-256-GCM` xác thực toàn vẹn.
              + **Cơ Chế Khóa Chủ Dự Phòng Hậu Lượng Tử (PQC Master Key Escrow)**: Mọi tệp PDF, Word, Excel, PowerPoint, ZIP và `.pqc` khi khóa đều tự động nhúng phong bì khóa chủ hậu lượng tử (`KD_PQC_ESCROW` / `KryptoPQCEscrow`), cho phép mở khóa cứu hộ độc lập bằng `Master Key PQC` mà không cần biết mật khẩu người dùng.
              + Bổ sung nút 1 chạm **`🔑 Dùng Master Key PQC`** ngay tại Tab Mở Khóa để cứu hộ tệp tức thì.
            - **Chuẩn Hóa Tên Ứng Dụng Ngắn Gọn `Krypto` (Chống Ẩn Chữ & Xuống Dòng 100%)**:
              + Đặt tên ứng dụng ngắn gọn `Krypto` (6 ký tự) trên màn hình chính Android (`AndroidManifest.xml`), tiêu đề thanh điều hướng, thẻ trạng thái nổi và App Drawer, hiển thị trọn vẹn trên 1 dòng duy nhất ở mọi kích thước màn hình điện thoại.
            - **Kế thừa toàn diện**: Bàn phím PIN chế độ Sáng tương phản cao, Bảng Pháp y số chuẩn Responsive thẻ đơn (Rule 14), Thủy vân số tàng hình 2 lớp, hoạt động độc lập Offline 100%.
          files: |
            build-output/Krypto.apk
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
