name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/SecureDocShare.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/KryptoDoc.apk
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/SecureDocShare.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KryptoDoc-mobile-release-apk
          path: build-output/KryptoDoc.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.1
          name: "KryptoDoc v2.3.1 - Ultra-Compact Mobile UI & Clean Zero-Waste Design (Android APK)"
          body: |
            ## Ứng dụng Di Động KryptoDoc v2.3.1 (Tối Ưu Hóa Toàn Diện Giao Diện - Không Ô Thừa, Siêu Gọn Gàng)
            - **Sửa Lỗi Ẩn Hiện Tab (Tab Isolation Invariant)**:
              + Khắc phục hoàn toàn lỗi Tab Mở Khóa bị hiển thị thừa dồn xuống dưới Tab Mã Hóa.
              + Hai Tab hoạt động độc lập, cắt giảm hơn 50% chiều dài trang cuộn.
            - **Khu Vực Chọn Tệp Tinh Gọn (Sleek Horizontal Dropzone)**:
              + Thiết kế dạng thanh ngang siêu mỏng (58px thay vì 120px), loại bỏ nút bấm thừa trùng lặp.
              + Chạm trực tiếp vào toàn bộ khung để mở bộ chọn file native Android.
            - **Bộ Chuyển Đổi Segmented Control Siêu Hiện Đại**:
              + Thay thế 4 ô cấu hình khổng lồ chiếm diện tích bằng 2 thanh điều khiển dạng viên thuốc (Segmented Control Pills) chuẩn iOS/Android cao cấp.
              + Cấp độ phân quyền: `🔒 Khóa Mật Khẩu` vs `👁️ Chỉ Xem (Cấm Copy)`.
              + Định dạng xuất: `📄 Định Dạng Gốc` vs `📦 Nén .ZIP Có Pass`.
            - **Ô Nhập Mật Khẩu Hợp Nhất & Thước Đo Micro-Entropy**:
              + Tích hợp trực tiếp các nút công cụ: `[⚡ Mã Quân Sự 16-bit]` và `[📋 Copy]` ngay trong khung nhập.
              + Thước đo entropy 3px siêu mảnh gắn sát đáy ô nhập, loại bỏ các dòng ghi chú thừa rườm rà.
            - **Accordion Tùy Chọn Nâng Cao Thu Gọn (Collapsible Advanced Options)**:
              + Nhóm gọn tùy chọn Đóng dấu mờ (Watermark) và Nén Stream vào thanh menu thu gọn, chỉ mở khi cần.
            - **Bảng Kết Quả Tinh Tế & Hướng Dẫn Mở Tệp Thông Minh**:
              + Thu gọn đường dẫn lưu file dài dòng, hiển thị trạng thái `📁 Đã lưu vào Thư mục Downloads của máy`.
              + Tích hợp hộp mẹo hướng dẫn mở tệp dạng chạm để mở (Collapsible Accordion).
            - **Tải tệp APK**: Tải file `KryptoDoc.apk` bên dưới về điện thoại Android và chọn Cài đặt (Install).
          files: |
            build-output/KryptoDoc.apk
            build-output/SecureDocShare.apk
          draft: false
          prerelease: false
